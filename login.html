<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · RT UPA Sul</title>
<style>body{margin:0;background:#f4f7fb;color:#14253e;font:16px system-ui}main{max-width:390px;margin:12vh auto;padding:32px;background:white;border:1px solid #dde5f0;border-radius:18px}h1{font-size:25px}p{line-height:1.5;color:#52647d}form,label{display:grid;gap:10px}form{gap:20px}input,button{padding:13px;border:1px solid #ccd7e5;border-radius:9px;font:inherit}button{background:#1961bb;color:white;cursor:pointer}#message{min-height:24px;color:#a32929}@media(max-width:480px){main{margin:8vh 16px;padding:24px}}</style><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#142f3b"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body><main><p>UPA SUL · PASCOAL RAMOS</p><h1>Sua escala, em um só lugar.</h1><p>Entre para consultar e salvar suas escalas no computador ou no celular.</p><form id="login-form"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="message" role="status" aria-live="polite"></p><p>Acesso restrito às contas autorizadas. Para obter acesso ou redefinir sua senha, fale com o responsável pelo sistema.</p></main><script src="/src/login.js" defer></script></body></html>
